<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List Dashboard</title>
  <!-- Google Fonts & Phosphor Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="background-decorations">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>

  <main class="app-card">
    <!-- Header -->
    <header class="header">
      <div class="greeting-box">
        <span class="badge" id="day-badge">Hôm nay</span>
        <h1 class="greeting-title">Chào Bảo, <span class="highlight">hôm nay bạn thế nào?</span></h1>
        <p class="greeting-sub">Hãy quản lý các mục tiêu và công việc thật hiệu quả nhé!</p>
      </div>
      <div class="clock-box" aria-label="Thời gian thực">
        <div class="clock-display">
          <span id="clock-hours">00</span>
          <span class="colon">:</span>
          <span id="clock-minutes">00</span>
          <span class="colon">:</span>
          <span id="clock-seconds">00</span>
        </div>
        <div class="clock-date" id="clock-date">Thứ 6, 23/10/2026</div>
      </div>
    </header>

    <!-- Input Section -->
    <section class="input-section">
      <form id="todo-form" class="input-group" autocomplete="off">
        <div class="input-wrapper">
          <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 256 256" fill="currentColor">
            <path d="M224,128a8,8,0,0,1-8,8H136v80a8,8,0,0,1-16,0V136H40a8,8,0,0,1,0-16h80V40a8,8,0,0,1,16,0v80h80A8,8,0,0,1,224,128Z"></path>
          </svg>
          <input 
            type="text" 
            id="task-input" 
            placeholder="Nhập công việc cần làm hôm nay..." 
            aria-label="Nội dung công việc"
          />
        </div>
        <button type="submit" id="add-btn" class="btn-primary">
          <span>Thêm</span>
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 256 256" fill="currentColor">
            <path d="M221.66,133.66l-72,72a8,8,0,0,1-11.32-11.32L196.69,136H40a8,8,0,0,1,0-16H196.69L138.34,61.66a8,8,0,0,1,11.32-11.32l72,72A8,8,0,0,1,221.66,133.66Z"></path>
          </svg>
        </button>
      </form>
    </section>

    <!-- Task List -->
    <section class="task-list-section">
      <div class="list-header">
        <h2>Danh sách công việc</h2>
        <span class="status-summary" id="task-filter-status">Tất cả mục</span>
      </div>

      <ul id="task-list" class="task-list" aria-live="polite">
        <!-- Render động bằng JS, có mẫu ban đầu -->
      </ul>

      <!-- Empty state khi không có task -->
      <div id="empty-state" class="empty-state hidden">
        <div class="empty-icon">🎉</div>
        <h3>Không có công việc nào!</h3>
        <p>Tuyệt vời! Hãy thêm một công việc mới để bắt đầu ngày làm việc.</p>
      </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <div class="footer-counter">
        <span class="counter-label">Tổng số công việc:</span>
        <span class="counter-badge" id="task-count">0</span>
      </div>
      <div class="footer-progress">
        <span id="completed-count">Hoàn thành: 0</span>
      </div>
    </footer>
  </main>

  <script>
    // Logic cập nhật Đồng hồ Thời gian thực
    function updateClock() {
      const now = new Date();
      const pad = (n) => String(n).padStart(2, '0');

      document.getElementById('clock-hours').textContent = pad(now.getHours());
      document.getElementById('clock-minutes').textContent = pad(now.getMinutes());
      document.getElementById('clock-seconds').textContent = pad(now.getSeconds());

      const daysOfWeek = ['Chủ Nhật', 'Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy'];
      const dayName = daysOfWeek[now.getDay()];
      const dateStr = `${dayName}, ${pad(now.getDate())}/${pad(now.getMonth() + 1)}/${now.getFullYear()}`;
      document.getElementById('clock-date').textContent = dateStr;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Logic Quản lý Danh sách công việc (To-do List)
    const form = document.getElementById('todo-form');
    const taskInput = document.getElementById('task-input');
    const taskList = document.getElementById('task-list');
    const taskCountEl = document.getElementById('task-count');
    const completedCountEl = document.getElementById('completed-count');
    const emptyState = document.getElementById('empty-state');

    // Dữ liệu mẫu khởi tạo
    let tasks = [
      { id: 1, text: 'Lập kế hoạch làm việc buổi sáng', completed: true },
      { id: 2, text: 'Thiết kế giao diện UI To-do List', completed: false },
      { id: 3, text: 'Review lại mã nguồn và tài liệu bàn giao', completed: false }
    ];

    function saveTasks() {
      localStorage.setItem('user_tasks', JSON.stringify(tasks));
    }

    function loadTasks() {
      const saved = localStorage.getItem('user_tasks');
      if (saved) {
        try {
          tasks = JSON.parse(saved);
        } catch (e) {
          console.error(e);
        }
      }
    }

    function renderTasks() {
      taskList.innerHTML = '';

      if (tasks.length === 0) {
        emptyState.classList.remove('hidden');
      } else {
        emptyState.classList.add('hidden');
      }

      tasks.forEach((task) => {
        const li = document.createElement('li');
        li.className = `task-item ${task.completed ? 'completed' : ''}`;
        li.dataset.id = task.id;

        li.innerHTML = `
          <label class="checkbox-container">
            <input type="checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask(${task.id})">
            <span class="checkmark"></span>
          </label>
          <span class="task-text" onclick="toggleTask(${task.id})">${escapeHtml(task.text)}</span>
          <button class="delete-btn" onclick="deleteTask(event, ${task.id})" title="Xoá công việc" aria-label="Xoá">
            <span>Xóa</span>
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 256 256" fill="currentColor">
              <path d="M216,48H176V40a24,24,0,0,0-24-24H104A24,24,0,0,0,80,40v8H40a8,8,0,0,0,0,16h8V208a16,16,0,0,0,16,16H192a16,16,0,0,0,16-16V64h8a8,8,0,0,0,0-16ZM96,40a8,8,0,0,1,8-8h48a8,8,0,0,1,8,8v8H96Zm96,168H64V64H192ZM112,104v64a8,8,0,0,1-16,0V104a8,8,0,0,1,16,0Zm48,0v64a8,8,0,0,1-16,0V104a8,8,0,0,1,16,0Z"></path>
            </svg>
          </button>
        `;
        taskList.appendChild(li);
      });

      // Cập nhật Footer thống kê
      const total = tasks.length;
      const completed = tasks.filter(t => t.completed).length;
      taskCountEl.textContent = total;
      completedCountEl.textContent = `Hoàn thành: ${completed}/${total}`;
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, function(m) {
        return {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#039;'
        }[m];
      });
    }

    function addTask(text) {
      const trimmed = text.trim();
      if (!trimmed) {
        alert('Vui lòng nhập nội dung!');
        return;
      }
      const newTask = {
        id: Date.now(),
        text: trimmed,
        completed: false
      };
      tasks.unshift(newTask);
      saveTasks();
      renderTasks();
    }

    window.toggleTask = function(id) {
      tasks = tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
      saveTasks();
      renderTasks();
    };

    window.deleteTask = function(event, id) {
      if (event) {
        event.stopPropagation();
      }
      
      const itemEl = document.querySelector(`.task-item[data-id="${id}"]`);
      if (itemEl) {
        // Thêm class fade-out để kích hoạt hiệu ứng mờ dần và thu nhỏ
        itemEl.classList.add('fade-out');

        // Đợi hiệu ứng animation kết thúc rồi mới xoá khỏi DOM và dữ liệu
        setTimeout(() => {
          tasks = tasks.filter(t => t.id !== id);
          saveTasks();
          renderTasks();
        }, 350);
      } else {
        tasks = tasks.filter(t => t.id !== id);
        saveTasks();
        renderTasks();
      }
    };

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      addTask(taskInput.value);
      taskInput.value = '';
      taskInput.focus();
    });

    // Khởi chạy khi load trang
    loadTasks();
    renderTasks();
  </script>
</body>
</html>
